<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6E20A0"><link rel="preload" as="image" href="/scout-logo-lg.png"><link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SCOUTVERSE">
<title>SCOUTVERSE</title>
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
:root{--g:#6E20A0;--g2:#9B59C6;--bg:#F6F2FA;--tx:#261A32;--mu:#6B7280}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
header{background:var(--g);color:#fff;padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
.wrap,.box{max-width:640px;margin:0 auto;padding:14px}
.card,.box form,.hero{background:#fff;border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 3px #0001}
.hero{text-align:center;background:linear-gradient(160deg,var(--g),var(--g2));color:#fff}
.hero h1{margin:6px 0 2px;letter-spacing:1px}.hero p{margin:4px 0}
label{display:block;font-size:14px;color:var(--mu);margin:8px 0}
input,select,textarea{width:100%;padding:11px;border:1px solid #d8cfe3;border-radius:10px;font:inherit;color:var(--tx);background:#fff;margin-top:3px}
textarea{min-height:80px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;width:100%;margin-top:8px;cursor:pointer}
.btn:disabled{opacity:.5}.btn.ghost{background:#fff;color:var(--g);border:1px solid var(--g)}
button{font:inherit;cursor:pointer}
.link{background:none;border:0;color:var(--g);text-decoration:underline;padding:8px}
.who{display:flex;flex-direction:column;margin-bottom:6px}.who small,small{color:var(--mu)}
.top{display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font-weight:700;object-fit:cover;flex:none}
article img.ph,#prev img{width:100%;border-radius:10px;margin:6px 0;max-height:420px;object-fit:cover}
.rx,.acts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.rx button,.acts button{border:1px solid #d8cfe3;background:#fff;border-radius:20px;padding:6px 12px;font-size:14px}
.rx{flex-wrap:nowrap;gap:8px}
.rx button{flex:1;min-width:0;padding:9px 2px;font-size:18px;border-radius:14px;background:var(--bg);border:1px solid transparent;transition:transform .15s,background .15s}
.rx button:active{transform:scale(.92)}
.rx button small{font-size:13px;font-weight:600;color:inherit}
.rx button.on{background:var(--g);color:#fff;border-color:var(--g)}
.notif{cursor:pointer}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:0 -14px 12px}
.tile{position:relative;aspect-ratio:3/4;border:0;padding:0;background-size:cover;background-position:center;overflow:hidden;color:#fff;cursor:pointer}
.tile .tt{display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;font-size:13px;height:100%;line-height:1.2;word-break:break-word}
.tile .vw{position:absolute;left:6px;bottom:5px;font-style:normal;font-size:12px;font-weight:700;text-shadow:0 1px 3px #000a}
.tile .rb{position:absolute;right:6px;top:5px;font-style:normal;text-shadow:0 1px 3px #000a}
.hic{margin-left:auto;display:flex;gap:8px}
.hic button{position:relative;width:36px;height:36px;border-radius:12px;border:2px solid #fff;background:none;display:grid;place-items:center;padding:0}
.hic button.c{border:0;background:#ffffff26;border-radius:50%}
.bdg{position:absolute;top:-5px;right:-5px;background:#e11d48;color:#fff;font-style:normal;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--g)}
.bdg:empty{display:none}
nav button{font-size:11px!important}
article .ph{width:calc(100% + 28px);max-width:none;margin:8px -14px 0;border-radius:0;max-height:560px;cursor:pointer}
article .rp .ph{width:100%;margin:6px 0 0;border-radius:10px;cursor:default}
.tx{margin:8px -14px;min-height:210px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-weight:700;padding:24px;line-height:1.3;white-space:pre-wrap;word-break:break-word;cursor:pointer}
.who b .link{color:var(--tx);text-decoration:none;padding:0}
.rx{border-top:1px solid #e9e2f0;margin:10px 0 0;padding-top:6px;gap:4px;justify-content:flex-start}
.rx button{flex:none;min-width:70px;background:none;border:0;font-size:16px;font-weight:600;color:var(--mu);padding:8px 12px;border-radius:20px}
.rx button.on{background:#EFE6F7;color:var(--g)}
@keyframes fill{from{width:0}to{width:100%}}
#ov.paused .seg{animation-play-state:paused!important}
.sb{flex:1;border:0;border-radius:12px;padding:12px 4px;background:#2a2a2a;color:#fff;font-weight:600;font-size:13px}.sb.on{background:var(--g)}
.cnt{position:absolute;top:8px;right:8px;background:#fff;color:var(--g);border-radius:10px;padding:1px 7px;font-size:11px;font-style:normal;font-weight:700}
.dot{background:var(--g2);color:#fff;border-radius:12px;padding:2px 8px;font-size:12px}
.chat{max-height:calc(100vh - 250px);min-height:200px;overflow:auto;padding:4px 0}
.tabs{display:flex;gap:6px;margin:0 0 10px}.tabs button{flex:1;font-size:13px;padding:10px 4px;border:0;border-radius:12px;background:#fff;font-weight:600;color:var(--g)}.tabs .on{background:var(--g);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:12px 0;border-top:1px solid #e9e2f0;border-bottom:1px solid #e9e2f0;padding:10px 0}
.stats b{display:block;font-size:18px}.stats small{font-size:12px}
.rx button{padding:10px 2px;font-size:13px;font-weight:600}
.actus{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.actu{flex:none;width:112px;height:196px;border-radius:14px;border:0;color:#fff;background:linear-gradient(160deg,var(--g),var(--g2)) center/cover;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:8px;text-align:left;font-size:12px;position:relative;overflow:hidden;box-shadow:0 1px 3px #0002}
.actu .av{position:absolute;top:8px;left:8px;width:34px;height:34px;border:3px solid #fff;font-size:14px}
.actu em{font-style:normal;margin-top:2px;line-height:1.2}
.actu.add{background:#fff;color:var(--g);border:1px dashed var(--g);align-items:center;justify-content:center;text-align:center;font-weight:600}
.actu.add span{font-size:30px;line-height:1}
.actu.me{background:linear-gradient(160deg,var(--g),var(--g2)) center/cover;color:#fff;border:0;justify-content:flex-end;align-items:center;text-align:center}
.actu.me .ini{position:absolute;top:26%;left:0;right:0;font-size:60px;font-weight:700;text-align:center}
.actu.me .pl{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:var(--g);color:#fff;border:3px solid #fff;display:grid;place-items:center;font-style:normal;font-size:22px;line-height:1}
.actu.me b{background:#000a;margin:0 -8px -8px;padding:24px 6px 9px;width:calc(100% + 16px);text-align:center;font-size:12px}
.cm{border-top:1px solid #e9e2f0;padding:8px 0;font-size:15px}
.err{color:#b91c1c}.empty{text-align:center;color:var(--mu);padding:24px}.note{font-size:13px;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e3dbec;display:flex;z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:12px;line-height:1.3;color:var(--g);font-weight:600}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%}
#toast.show{opacity:1}#toast.err{background:#b91c1c}
#splash{position:fixed;inset:0;background:#6E20A0;display:grid;place-items:center;z-index:100;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(55vw,240px);height:auto;animation:pop .9s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
</style></head><body>
<div id="splash" aria-hidden="true"><img src="/scout-logo-lg.png" alt=""></div>
<script>setTimeout(function(){var x=document.getElementById('splash');if(x){x.classList.add('out');setTimeout(function(){x.remove()},700)}},5000)</script>
<div id="app"></div><div id="toast" role="status"></div>
<script src="config.js"></script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const sb=createClient(window.SCOUT_URL,window.SCOUT_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(m,e)=>{const t=$('#toast');t.textContent=m;t.className=e?'err show':'show';setTimeout(()=>t.className='',3500)};
const KINDS={like:'👍 J’aime',bravo:'👏 Bravo',inspirant:'✨ Inspirant',merci:'🙏 Merci'};
const ROLES=[['scout','Scout'],['responsable','Responsable'],['formateur','Formateur'],['ancien','Ancien scout'],['autre','Autre']];
const LOGO='<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#fff" stroke-width="2"/><path d="M16 5l4 11-4 11-4-11z" fill="#fff"/><circle cx="16" cy="16" r="2" fill="#9B59C6"/></svg>';
const PS=10,ago=d=>new Date(d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
const friendly=e=>/Invalid login/i.test(e.message)?'E-mail ou mot de passe incorrect.':/already registered/i.test(e.message)?'Cette adresse est déjà utilisée.':/rate limit/i.test(e.message)?'Trop de tentatives, réessayez dans quelques minutes.':/Email not confirmed/i.test(e.message)?'Confirmez votre e-mail avant de vous connecter.':'Erreur : '+e.message;
let S={user:null,me:null,mode:'login',view:'feed',posts:[],more:false,page:0,open:{},cm:{},img:null,recovery:false,err:null,ready:false};

sb.auth.onAuthStateChange((ev,ses)=>{
  if(ev==='PASSWORD_RECOVERY')S.recovery=true;
  S.user=ses?.user??null;
  setTimeout(async()=>{
    if(S.user){await loadMe();await loadPosts(true);await loadUnread();await loadActus();S.t??=setInterval(()=>{if(S.user){loadUnread();if(S.view==='feed'&&!$('#ov'))loadActus()}},30000);S.pc??=setInterval(()=>{if(S.user&&S.view==='chat')loadChat()},5000)}else{S.me=null;S.posts=[]}
    S.ready=true;render();
    if(S.user){enablePush(true);if(location.hash==='#messages'){history.replaceState(null,'',location.pathname);H.nav({target:{dataset:{v:'msgs'}}})}}
  },0);
});

async function loadMe(){const{data}=await sb.from('profiles').select('*').eq('id',S.user.id).single();S.me=data}
async function loadUnread(){
  const{count}=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('read',false);
  S.unread=count||0;const n=$('#nb');if(n)n.textContent=S.unread||'';
  const{count:mc}=await sb.from('messages').select('id',{count:'exact',head:true}).eq('recipient_id',S.user.id).eq('read',false);
  S.munread=mc||0;const b=$('#mb');if(b)b.textContent=S.munread||'';
}
async function loadNotifs(){
  const{data,error}=await sb.from('notifications').select('id,type,read,post_id,actor_id,created_at,profiles!actor_id(first_name,last_name),posts(content)').order('created_at',{ascending:false}).limit(50);
  if(error)toast(friendly(error),1);S.notifs=error?[]:data;
  if(S.view==='notifs')$('.wrap').innerHTML=notifView();
}
async function loadMembers(){
  const{data,error}=await sb.from('profiles').select('id,first_name,last_name,group_name,province,avatar_url').order('created_at',{ascending:false}).limit(100);
  if(error)toast(friendly(error),1);S.members=error?[]:data;
  if(S.view==='msgs')$('.wrap').innerHTML=msgsView();
}
async function loadUser(id){
  const{data:p}=await sb.from('profiles').select('*').eq('id',id).single();S.U=p;
  const[ca,cb,cc]=await Promise.all([
    sb.from('follows').select('follower_id',{count:'exact',head:true}).eq('followed_id',id),
    sb.from('follows').select('followed_id',{count:'exact',head:true}).eq('follower_id',id),
    sb.from('follows').select('follower_id',{count:'exact',head:true}).eq('follower_id',S.user.id).eq('followed_id',id)]);
  S.fc=ca.count||0;S.fg=cb.count||0;S.fm=(cc.count||0)>0;
  const cd=await sb.from('blocks').select('blocked_id',{count:'exact',head:true}).eq('blocker_id',S.user.id).eq('blocked_id',id);S.ub=(cd.count||0)>0;
  const{data,error}=await sb.from('posts').select(SEL).eq('author_id',id).order('created_at',{ascending:false}).limit(50);
  S.posts=error?[]:await attach(data);S.more=false;S.err=error?friendly(error):null;
  if(S.view==='user'){$('.wrap').innerHTML=userView();renderFeed()}
}
const SEL='id,content,image_url,created_at,author_id,repost_of,views_count,group_id,grp:scout_groups!group_id(id,name),profiles!author_id(first_name,last_name,group_name,avatar_url),comments(count),reactions(user_id,kind)';
const GR=['linear-gradient(160deg,#6E20A0,#9B59C6)','linear-gradient(160deg,#0f4c81,#3aa6b9)','linear-gradient(160deg,#7b2d8e,#d6609b)','linear-gradient(160deg,#b45309,#f59e0b)'];
async function openStory(uid){await loadActus();
  const order=[];(S.actus||[]).forEach(a=>{if(!order.includes(a.author_id))order.push(a.author_id)});order.sort((a,b)=>(b===S.user.id)-(a===S.user.id));
  const items=order.slice(Math.max(0,order.indexOf(uid))).flatMap(u=>(S.actus||[]).filter(a=>a.author_id===u).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)));
  if(!items.length)return toast('Cette actu a expiré.',1);
  S.sv={items,i:0,likes:{},views:{},rem:5000,t0:0,paused:false};
  const{data}=await sb.from('actu_likes').select('actu_id,user_id').in('actu_id',items.map(a=>a.id));
  (data||[]).forEach(l=>(S.sv.likes[l.actu_id]??=[]).push(l.user_id));
  const own=items.filter(a=>a.author_id===S.user.id).map(a=>a.id);
  if(own.length){const{data:vw}=await sb.from('actu_views').select('actu_id').in('actu_id',own);(vw||[]).forEach(x=>S.sv.views[x.actu_id]=(S.sv.views[x.actu_id]||0)+1)}
  drawStory();
}
function drawStory(){
  clearTimeout(S.st);const v=S.sv,a=v.items[v.i];rmOv();
  const lk=v.likes[a.id]||[],mine=lk.includes(S.user.id),own=a.author_id===S.user.id,o=document.createElement('div');
  o.id='ov';o.setAttribute('role','dialog');o.style.cssText='position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;color:#fff';
  const txt=a.image_url?'position:absolute;bottom:0;left:0;right:0;margin:0;padding:28px 16px 12px;background:linear-gradient(#0000,#000a);font-size:17px':'font-size:26px;font-weight:700;text-align:center;padding:24px';
  o.innerHTML=`<div style="display:flex;gap:4px;padding:10px 10px 6px">${v.items.map((_,k)=>k).filter(k=>v.items[k].author_id===a.author_id).map(k=>`<div style="flex:1;height:3px;background:#fff5;border-radius:3px;overflow:hidden"><div class="seg" style="height:100%;background:#fff;width:${k<v.i?'100%':'0'};${k===v.i?'animation:fill 5s linear forwards':''}"></div></div>`).join('')}</div><div style="display:flex;align-items:center;gap:10px;padding:4px 12px"><button class="link" style="color:#fff;font-size:26px;padding:0 6px" data-act="closeov" aria-label="Retour">←</button>${av(a.profiles)}<div style="flex:1"><b>${esc(a.profiles?.first_name)} ${esc(a.profiles?.last_name)}</b><br><small style="color:#ddd">${actuTime(a.created_at)}</small></div>${own?`<button class="link" style="color:#fff" data-act="delactu" data-id="${a.id}">Supprimer</button>`:''}<button class="link" style="color:#fff;font-size:22px" data-act="closeov" aria-label="Fermer">✕</button></div><div id="sm" style="flex:1;position:relative;display:grid;place-items:center;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;${a.image_url?'':'background:'+GR[a.id.charCodeAt(0)%4]}">${a.image_url?`<img src="${esc(a.image_url)}" alt="Image de l’actu" style="max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;-webkit-touch-callout:none">`:''}${a.content?`<p style="${txt};white-space:pre-wrap">${esc(a.content)}</p>`:''}</div><div style="padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#111">${own?`<button class="link" style="color:#fff;text-decoration:none;padding:0" data-act="viewers">👁 ${v.views[a.id]||0} vue(s) · 👍 ${lk.length} j’aime · <u>voir qui</u></button>`:`<div style="display:flex;gap:8px"><button class="sb${mine?' on':''}" data-act="slike">👍 J’aime</button><button class="sb" data-act="sreply">↩ Répondre</button><button class="sb" data-act="srepost">🔁 Republier</button></div><form data-f="sreply" style="display:none;gap:6px;margin-top:8px"><input name="m" maxlength="500" placeholder="Votre réponse…" aria-label="Votre réponse" style="margin:0"><button class="btn" style="width:auto;margin:0">Envoyer</button></form>`}</div>`;
  app.append(o);
  v.rem=5000;v.t0=Date.now();v.paused=false;S.st=setTimeout(snext,5000);
  if(!own)sb.from('actu_views').upsert({actu_id:a.id,viewer_id:S.user.id},{onConflict:'actu_id,viewer_id',ignoreDuplicates:true}).then(()=>{});
  // Toucher et maintenir = pause ; toucher rapidement = précédent / suivant
  const m=o.querySelector('#sm');let t0=0,x0=0,y0=0,held=false;
  m.addEventListener('pointerdown',e=>{t0=Date.now();x0=e.clientX;y0=e.clientY;held=true;pauseStory()});
  m.addEventListener('pointerup',e=>{
    if(!held)return;held=false;
    const dx=e.clientX-x0,dy=e.clientY-y0;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){dx<0?snext():H.sprev();return}
    if(dy>90&&dy>Math.abs(dx)){closeOv();return}
    if(Date.now()-t0<250){const r=m.getBoundingClientRect();(e.clientX-r.left)<r.width*0.3?H.sprev():snext()}else resumeStory();
  });
  m.addEventListener('pointercancel',()=>{if(held){held=false;resumeStory()}});
}
function snext(){const v=S.sv;if(!v)return;if(v.i+1>=v.items.length){clearTimeout(S.st);closeOv();return}v.i++;drawStory()}
function pauseStory(){const v=S.sv;if(!v||v.paused)return;v.paused=true;clearTimeout(S.st);v.rem-=Date.now()-v.t0;$('#ov')?.classList.add('paused')}
function resumeStory(){const v=S.sv;if(!v||!v.paused)return;v.paused=false;v.t0=Date.now();S.st=setTimeout(snext,Math.max(v.rem,200));$('#ov')?.classList.remove('paused')}
async function loadConvs(){
  const{data,error}=await sb.from('messages').select('id,content,created_at,read,sender_id,recipient_id,s:profiles!sender_id(id,first_name,last_name,avatar_url),r:profiles!recipient_id(id,first_name,last_name,avatar_url)').order('created_at',{ascending:false}).limit(200);
  if(error)toast(friendly(error),1);
  const m=new Map();
  (data||[]).forEach(x=>{const mine=x.sender_id===S.user.id,id=mine?x.recipient_id:x.sender_id;
    if(!m.has(id))m.set(id,{id,p:mine?x.r:x.s,last:x.content,mine,unread:0});
    if(!mine&&!x.read)m.get(id).unread++});
  S.convs=[...m.values()];if(S.view==='msgs')$('.wrap').innerHTML=msgsView();
}
async function loadChat(first){
  if(S.view!=='chat')return;const o=S.ch,me=S.user.id;
  if(!S.cp||S.cp.id!==o){const{data:p}=await sb.from('profiles').select('id,first_name,last_name,avatar_url').eq('id',o).single();S.cp=p;const t=$('#chn');if(t&&p)t.textContent=p.first_name+' '+p.last_name}
  const{data,error}=await sb.from('messages').select('id,content,created_at,sender_id,read,audio_path,audio_secs,played_at').or(`and(sender_id.eq.${me},recipient_id.eq.${o}),and(sender_id.eq.${o},recipient_id.eq.${me})`).order('created_at').limit(200);

async function startRec(){
  if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Messages vocaux non pris en charge sur ce navigateur.',1);
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=['audio/mp4','audio/webm','audio/ogg'].find(m=>MediaRecorder.isTypeSupported(m))||'';
    const mr=new MediaRecorder(st,mime?{mimeType:mime}:undefined);
    const r=S.rc={mr,st,chunks:[],t0:Date.now(),mime:mr.mimeType||mime||'audio/webm',send:true,to:S.ch};
    mr.ondataavailable=e=>{if(e.data&&e.data.size)r.chunks.push(e.data)};
    mr.onstop=async()=>{
      r.st.getTracks().forEach(t=>t.stop());clearInterval(r.tm);S.rc=null;updateMic();
      const secs=Math.round((Date.now()-r.t0)/1000);
      if(!r.send||secs<1||!r.chunks.length)return;
      const type=r.mime.split(';')[0],ext=type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm';
      const path=`${S.user.id}/${r.to}/${Date.now()}.${ext}`,blob=new Blob(r.chunks,{type});
      if(blob.size>5242880)return toast('Message vocal trop long.',1);
      const{error:e1}=await sb.storage.from('voice').upload(path,blob,{contentType:type});
      if(e1)return toast('Envoi impossible : '+e1.message,1);
      const{error:e2}=await sb.from('messages').insert({sender_id:S.user.id,recipient_id:r.to,content:'🎤 Message vocal',audio_path:path,audio_secs:secs});
      if(e2)return toast(friendly(e2),1);
      if(S.view==='chat')await loadChat(true);
    };
    mr.start();r.tm=setInterval(()=>{updateMic();if(Date.now()-r.t0>120000)stopRec(true)},500);updateMic();
  }catch(x){toast('Microphone refusé ou indisponible.',1)}
}

    const h=(now-new Date(p.created_at))/36e5,l=(p.reactions||[]).length,c=p.comments?.[0]?.count||0;

  });

}

  if(list.length){const{data:rp}=await sb.from('posts').select('repost_of').in('repost_of',list.map(p=>p.id));const c={};(rp||[]).forEach(r=>c[r.repost_of]=(c[r.repost_of]||0)+1);list.forEach(p=>p.rc=c[p.id]||0)}

}

async function shrink(f){
  if(!f.type.startsWith('image/'))throw new Error('Choisissez une image.');
  const b=await createImageBitmap(f),r=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement('canvas');
  c.width=Math.round(b.width*r);c.height=Math.round(b.height*r);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
  const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82));
  if(!blob||blob.size>2097152)throw new Error('Image trop lourde (2 Mo maximum).');return blob;
}

}

function renderFeed(){

  const inf=S.view==='feed',empty=S.view==='search'?'':'<p class="empty">Aucune publication pour le moment. Soyez le premier à partager !</p>';
  f.innerHTML=S.err?`<p class="err">${esc(S.err)} <button class="link" data-act="retry">Réessayer</button></p>`:S.posts.length?S.posts.map((p,i)=>(inf&&S.rs===i?'<div class="card" style="text-align:center;background:#EFE6F7"><b>✅ Vous avez tout vu !</b><br><small>Voici des publications au hasard.</small></div>':'')+card(p)).join('')+(inf?'<div id="more" style="height:70px;text-align:center;color:var(--mu)"><small>Chargement…</small></div>':(S.more?'<button class="btn ghost" data-act="more">Voir plus</button>':'')):empty;
  if(inf)watchMore();trackViews();
}

}
async function refreshCount(id){

  const p=S.posts.find(x=>x.id===id);if(p)p.comments=[{count}];renderFeed();
}
const rmOv=()=>$('#ov')?.remove();
async function closeOv(){
  clearTimeout(S.st);rmOv();
  if(S.ovp){
    S.ovp=false;S.ign=true;
    await new Promise(ok=>{const h=()=>{removeEventListener('popstate',h);ok()};addEventListener('popstate',h);history.back();setTimeout(()=>{removeEventListener('popstate',h);ok()},600)});
    setTimeout(()=>{S.ign=false},50);
  }
}
const rk=r=>r?(r.v+'|'+(r.u||'')+'|'+(r.id||'')):'';
function routeOf(k,e){
  const d=e.target.dataset||{};
  if(k==='nav')return d.v==='me'?{v:'user',u:S.user.id}:{v:d.v};
  if(k==='user')return{v:'user',u:d.u};
  if(k==='opengroup')return{v:'group',id:d.id};
  if(k==='chat')return{v:'chat',u:d.u};
  if(k==='open')return{v:'post',id:d.id};
  if(k==='notif')return d.p&&d.p!=='null'?{v:'post',id:d.p}:{v:'user',u:d.u};
}
['nav','user','opengroup','chat','open','notif'].forEach(k=>{
  const f=H[k];
  H[k]=function(e){
    if(!S.noPush&&S.user){const r=routeOf(k,e);if(r&&r.v&&rk(r)!==rk(history.state)){history.replaceState({...history.state,y:scrollY},'');history.pushState(r,'')}}
    return f.call(H,e);
  };
});
async function openPostById(id){
  const{data,error}=await sb.from('posts').select(SEL).eq('id',id).single();
  if(error||!data)return toast('Cette publication n’est plus disponible.',1);
  await attach([data]);S.view='post';S.posts=[data];S.more=false;S.err=null;render();await loadCm(id);
}
async function restore(r){
  S.noPush=true;
  try{
    if(r.v==='user')await H.user({target:{dataset:{u:r.u}}});
    else if(r.v==='group')await H.opengroup({target:{dataset:{id:r.id}}});
    else if(r.v==='chat')await H.chat({target:{dataset:{u:r.u}}});
    else if(r.v==='post')await openPostById(r.id);
    else await H.nav({target:{dataset:{v:r.v}}});
  }finally{S.noPush=false}
  if(r.y)setTimeout(()=>scrollTo(0,r.y),60);
}
history.replaceState({v:'feed'},'');
addEventListener('popstate',e=>{
  if(S.ign){S.ign=false;return}
  if(S.ovp||$('#ov')){S.ovp=false;clearTimeout(S.st);rmOv();return}   // retour = fermer la fenêtre ouverte
  const r=e.state;if(!S.user||!r||!r.v)return;
  restore(r);
});
// chaque fenêtre ouverte (publication, actus, menus) ajoute une étape d'historique
new MutationObserver(()=>{if($('#ov')&&!S.ovp){history.pushState({ov:1},'');S.ovp=true}}).observe(app,{childList:true});
// Tirer l'accueil vers le bas pour actualiser (application installée sur l'écran d'accueil)
if(navigator.standalone||matchMedia('(display-mode: standalone)').matches){
  let py=0,pon=false;
  addEventListener('touchstart',e=>{pon=scrollY<=0&&!$('#ov')&&S.view==='feed';py=e.touches[0].clientY},{passive:true});
  addEventListener('touchend',async e=>{
    if(!pon)return;pon=false;
    if(e.changedTouches[0].clientY-py>120&&scrollY<=0){toast('Actualisation…');await loadPosts(true);renderFeed();await loadActus();await loadUnread()}
  },{passive:true});
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)H[b.dataset.act]?.({target:b})});
app.addEventListener('change',e=>{
  if(e.target.id==='file'){
    const f=e.target.files[0];S.img=f||null;$('#prev').innerHTML='';
    if(f){const i=document.createElement('img');i.alt='Aperçu de la photo';i.src=URL.createObjectURL(f);$('#prev').append(i)}
  }
});
const F={
  async login(f){
    const d=new FormData(f),{error}=await sb.auth.signInWithPassword({email:d.get('email').trim(),password:d.get('p')});
    if(error)toast(friendly(error),1);
  },
  async signup(f){
    const d=new FormData(f);
    if(d.get('p')!==d.get('p2'))return toast('Les mots de passe ne sont pas identiques.',1);
    const meta={};['first_name','last_name','group_name','district','province','country','scout_role'].forEach(k=>meta[k]=String(d.get(k)).trim());
    meta.terms='true';
    const{data,error}=await sb.auth.signUp({email:d.get('email').trim(),password:d.get('p'),options:{data:meta}});
    if(error)return toast(friendly(error),1);
    if(!data.session){S.mode='login';render();toast('Compte créé ! Vérifiez votre boîte e-mail pour confirmer, puis connectez-vous.')}
    else toast('Bienvenue sur SCOUTVERSE !');
  },
  async forgot(f){
    const{error}=await sb.auth.resetPasswordForEmail(new FormData(f).get('email').trim(),{redirectTo:location.origin});
    error?toast(friendly(error),1):toast('Si cette adresse existe, un lien vient d’être envoyé.');
  },
  async newpass(f){
    const{error}=await sb.auth.updateUser({password:new FormData(f).get('p')});
    if(error)return toast(friendly(error),1);S.recovery=false;render();toast('Mot de passe modifié.');
  },
  async newgroup(f){
    const d=new FormData(f),b=f.querySelector('.btn');b.disabled=true;
    const{data,error}=await sb.from('scout_groups').insert({name:d.get('name').trim(),city:d.get('city').trim()||null,district:d.get('district').trim()||null,province:d.get('province').trim()||null,description:d.get('description').trim()||null,admin_id:S.user.id}).select('id').single();
    if(error){b.disabled=false;return toast(/row-level security/i.test(error.message)?'Création refusée : réservée aux responsables et formateurs (3 groupes maximum).':friendly(error),1)}
    await closeOv();toast('Groupe créé !');await H.opengroup({target:{dataset:{id:data.id}}});
  },
  async newunit(f){
    const d=new FormData(f);
    const{error}=await sb.from('group_units').insert({group_id:S.G.id,name:d.get('name').trim(),kind:d.get('kind'),description:d.get('description').trim()||null});
    if(error)return toast(friendly(error),1);
    closeOv();S.gtab='unites';await loadGroup(S.G.id,true);toast('Unité ajoutée.');
  },
  async search(f){
    const q=f.elements.q.value.trim();if(q.length<2)return toast('Tapez au moins 2 lettres.',1);
    S.q=q;const t=q.replace(/[,()%*_\\]/g,' ').trim().split(/\s+/).filter(Boolean).slice(0,3),whole=t.join(' ');
    if(!whole)return;
    let pq=sb.from('profiles').select('id,first_name,last_name,group_name,province,avatar_url');
    t.forEach(w=>{pq=pq.or(`first_name.ilike.%${w}%,last_name.ilike.%${w}%`)});
    const[p,g,po]=await Promise.all([pq.limit(20),
      sb.from('scout_groups').select('id,name,description,province,district,city,group_members(count)').or(`name.ilike.%${whole}%,city.ilike.%${whole}%,district.ilike.%${whole}%,description.ilike.%${whole}%`).limit(20),
      sb.from('posts').select(SEL).ilike('content','%'+whole+'%').order('created_at',{ascending:false}).limit(20)]);
    const er=p.error||g.error||po.error;if(er)return toast(friendly(er),1);
    S.sres={people:p.data,groups:g.data,posts:await attach(po.data)};S.posts=S.sres.posts;S.stab='all';
    $('.wrap').innerHTML=searchView();renderFeed();
  },
  async send(f){
    const m=f.elements.m.value.trim();if(!m)return;
    const{error}=await sb.from('messages').insert({sender_id:S.user.id,recipient_id:S.ch,content:m});
    if(error)return toast(friendly(error),1);
    f.reset();await loadChat(true);
  },
  async sreply(f){
    const a=S.sv.items[S.sv.i],m=f.elements.m.value.trim();if(!m)return;
    const q=a.content?' « '+a.content.slice(0,40)+' »':'';
    const{error}=await sb.from('messages').insert({sender_id:S.user.id,recipient_id:a.author_id,content:('↩ Réponse à votre actu'+q+' : '+m).slice(0,1000)});
    if(error)return toast(friendly(error),1);
    toast('Réponse envoyée dans ses messages.');clearTimeout(S.st);closeOv();
  },
  async actu(f){
    const t=f.elements.t.value.trim(),file=f.querySelector('input[type=file]').files[0],b=f.querySelector('.btn');
    if(!t&&!file)return toast('Écrivez un message ou ajoutez une photo.',1);
    if(!await clean(t))return;
    b.disabled=true;
    try{
      const url=file?await upload('post-images',file):null;
      const{error}=await sb.from('actus').insert({author_id:S.user.id,content:t,image_url:url});if(error)throw error;
      closeOv();await loadActus();toast('Actu publiée !');
    }catch(x){toast('Publication impossible : '+x.message,1);b.disabled=false}
  },
  async post(f){
    const t=$('#txt').value.trim(),b=$('#pub');if(!t)return toast('Écrivez un message.',1);
    if(!await clean(t))return;
    b.disabled=true;
    try{
      const url=S.img?await upload('post-images',S.img):null;
      const{error}=await sb.from('posts').insert({author_id:S.user.id,content:t,image_url:url,group_id:S.view==='group'?S.G.id:null});if(error)throw error;
      S.img=null;f.reset();$('#prev').innerHTML='';await closeOv();if(S.view==='group')await loadGroup(S.G.id,true);else await H.nav({target:{dataset:{v:'feed'}}});toast('Publication envoyée !');
    }catch(x){toast('Publication impossible : '+x.message,1)}
    b.disabled=false;
  },
  async comment(f){
    const id=f.closest('article').dataset.id,c=new FormData(f).get('c').trim();if(!c)return;
    if(!await clean(c))return;
    const{error}=await sb.from('comments').insert({post_id:id,author_id:S.user.id,content:c});
    if(error)return toast(friendly(error),1);
    await loadCm(id);await refreshCount(id);
  },
  async profile(f){
    const d=new FormData(f),u={};['first_name','last_name','group_name','district','province','country','scout_role','bio'].forEach(k=>u[k]=String(d.get(k)||'').trim());
    if(!u.first_name||!u.last_name)return toast('Prénom et nom obligatoires.',1);
    try{
      const a=$('#avf').files[0];if(a)u.avatar_url=await upload('avatars',a);
      const{error}=await sb.from('profiles').update(u).eq('id',S.user.id);if(error)throw error;
      await loadMe();S.view='user';render();await loadUser(S.user.id);toast('Profil enregistré.');
    }catch(x){toast('Enregistrement impossible : '+x.message,1)}
  }
};
app.addEventListener('submit',e=>{e.preventDefault();F[e.target.dataset.f]?.(e.target)});
app.addEventListener('input',e=>{if(e.target.id==='q')$('#ml').innerHTML=memList(e.target.value);if(e.target.id==='gq')$('#gl').innerHTML=glist(e.target.value)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.user&&S.view==='feed')loadActus()});
render();
</script></body></html>
