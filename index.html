<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176B45">
<title>SCOUTVERSE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23176B45'/%3E%3Cpath d='M16 5l4 11-4 11-4-11z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--g:#176B45;--g2:#38A169;--bg:#F4F6F5;--tx:#202B26;--mu:#6B7280}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:70px}
header{background:var(--g);color:#fff;padding:12px 16px;font-weight:700;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
.wrap,.box{max-width:640px;margin:0 auto;padding:14px}
.card,.box form,.hero{background:#fff;border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 3px #0001}
.hero{text-align:center;background:linear-gradient(160deg,var(--g),var(--g2));color:#fff}
.hero h1{margin:6px 0 2px;letter-spacing:1px}.hero p{margin:4px 0}
label{display:block;font-size:14px;color:var(--mu);margin:8px 0}
input,select,textarea{width:100%;padding:11px;border:1px solid #cfd8d3;border-radius:10px;font:inherit;color:var(--tx);background:#fff;margin-top:3px}
textarea{min-height:80px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;width:100%;margin-top:8px;cursor:pointer}
.btn:disabled{opacity:.5}.btn.ghost{background:#fff;color:var(--g);border:1px solid var(--g)}
button{font:inherit;cursor:pointer}
.link{background:none;border:0;color:var(--g);text-decoration:underline;padding:8px}
.who{display:flex;flex-direction:column;margin-bottom:6px}.who small,small{color:var(--mu)}
.top{display:flex;gap:10px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:var(--g2);color:#fff;display:grid;place-items:center;font-weight:700;object-fit:cover;flex:none}
article img.ph,#prev img{width:100%;border-radius:10px;margin:6px 0;max-height:420px;object-fit:cover}
.rx,.acts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.rx button,.acts button{border:1px solid #cfd8d3;background:#fff;border-radius:20px;padding:6px 12px;font-size:14px}
.rx{flex-wrap:nowrap;gap:8px}
.rx button{flex:1;min-width:0;padding:9px 2px;font-size:18px;border-radius:14px;background:var(--bg);border:1px solid transparent;transition:transform .15s,background .15s}
.rx button:active{transform:scale(.92)}
.rx button small{font-size:13px;font-weight:600;color:inherit}
.rx button.on{background:var(--g);color:#fff;border-color:var(--g)}
.notif{cursor:pointer}
@keyframes fill{from{width:0}to{width:100%}}
#ov.paused .seg{animation-play-state:paused!important}
.sb{flex:1;border:0;border-radius:12px;padding:12px 4px;background:#2a2a2a;color:#fff;font-weight:600;font-size:13px}.sb.on{background:var(--g)}
.cnt{position:absolute;top:8px;right:8px;background:#fff;color:var(--g);border-radius:10px;padding:1px 7px;font-size:11px;font-style:normal;font-weight:700}
.dot{background:var(--g2);color:#fff;border-radius:12px;padding:2px 8px;font-size:12px}
.chat{max-height:calc(100vh - 250px);min-height:200px;overflow:auto;padding:4px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:12px 0;border-top:1px solid #e5ebe8;border-bottom:1px solid #e5ebe8;padding:10px 0}
.stats b{display:block;font-size:18px}.stats small{font-size:12px}
.rx button{padding:10px 2px;font-size:13px;font-weight:600}
.actus{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.actu{flex:none;width:96px;height:156px;border-radius:14px;border:0;color:#fff;background:linear-gradient(160deg,var(--g),var(--g2)) center/cover;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:8px;text-align:left;font-size:12px;position:relative;overflow:hidden;box-shadow:0 1px 3px #0002}
.actu .av{position:absolute;top:8px;left:8px;width:34px;height:34px;border:3px solid #fff;font-size:14px}
.actu em{font-style:normal;margin-top:2px;line-height:1.2}
.actu.add{background:#fff;color:var(--g);border:1px dashed var(--g);align-items:center;justify-content:center;text-align:center;font-weight:600}
.actu.add span{font-size:30px;line-height:1}
.cm{border-top:1px solid #e5ebe8;padding:8px 0;font-size:15px}
.err{color:#b91c1c}.empty{text-align:center;color:var(--mu);padding:24px}.note{font-size:13px;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dfe6e2;display:flex;z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:12px;line-height:1.3;color:var(--g);font-weight:600}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%}
#toast.show{opacity:1}#toast.err{background:#b91c1c}
</style></head><body>
<div id="app"></div><div id="toast" role="status"></div>
<script src="config.js"></script>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const sb=createClient(window.SCOUT_URL,window.SCOUT_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(m,e)=>{const t=$('#toast');t.textContent=m;t.className=e?'err show':'show';setTimeout(()=>t.className='',3500)};
const KINDS={like:'👍 J’aime',bravo:'👏 Bravo',inspirant:'✨ Inspirant',merci:'🙏 Merci'};
const ROLES=[['scout','Scout'],['responsable','Responsable'],['formateur','Formateur'],['ancien','Ancien scout'],['autre','Autre']];
const LOGO='<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#fff" stroke-width="2"/><path d="M16 5l4 11-4 11-4-11z" fill="#fff"/><circle cx="16" cy="16" r="2" fill="#38A169"/></svg>';
const PS=10,ago=d=>new Date(d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
const friendly=e=>/Invalid login/i.test(e.message)?'E-mail ou mot de passe incorrect.':/already registered/i.test(e.message)?'Cette adresse est déjà utilisée.':/rate limit/i.test(e.message)?'Trop de tentatives, réessayez dans quelques minutes.':/Email not confirmed/i.test(e.message)?'Confirmez votre e-mail avant de vous connecter.':'Erreur : '+e.message;
let S={user:null,me:null,mode:'login',view:'feed',posts:[],more:false,page:0,open:{},cm:{},img:null,recovery:false,err:null,ready:false};

sb.auth.onAuthStateChange((ev,ses)=>{
  if(ev==='PASSWORD_RECOVERY')S.recovery=true;
  S.user=ses?.user??null;
  setTimeout(async()=>{
    if(S.user){await loadMe();await loadPosts(true);await loadUnread();await loadActus();S.t??=setInterval(()=>S.user&&loadUnread(),30000);S.pc??=setInterval(()=>{if(S.user&&S.view==='chat')loadChat()},5000)}else{S.me=null;S.posts=[]}
    S.ready=true;render();
  },0);
});

async function loadMe(){const{data}=await sb.from('profiles').select('*').eq('id',S.user.id).single();S.me=data}
async function loadUnread(){
  const{count}=await sb.from('notifications').select('id',{count:'exact',head:true}).eq('read',false);
  S.unread=count||0;const n=$('#nb');if(n)n.textContent=S.unread||'';
  const{count:mc}=await sb.from('messages').select('id',{count:'exact',head:true}).eq('recipient_id',S.user.id).eq('read',false);
  S.munread=mc||0;const b=$('#mb');if(b)b.textContent=S.munread||'';
}
async function loadNotifs(){
  const{data,error}=await sb.from('notifications').select('id,type,read,post_id,actor_id,created_at,profiles!actor_id(first_name,last_name),posts(content)').order('created_at',{ascending:false}).limit(50);
  if(error)toast(friendly(error),1);S.notifs=error?[]:data;
  if(S.view==='notifs')$('.wrap').innerHTML=notifView();
}
async function loadMembers(){
  const{data,error}=await sb.from('profiles').select('id,first_name,last_name,group_name,province,avatar_url').order('created_at',{ascending:false}).limit(100);
  if(error)toast(friendly(error),1);S.members=error?[]:data;
  if(S.view==='msgs')$('.wrap').innerHTML=msgsView();
}
async function loadUser(id){
  const{data:p}=await sb.from('profiles').select('*').eq('id',id).single();S.U=p;
  const[ca,cb,cc]=await Promise.all([
    sb.from('follows').select('follower_id',{count:'exact',head:true}).eq('followed_id',id),
    sb.from('follows').select('followed_id',{count:'exact',head:true}).eq('follower_id',id),
    sb.from('follows').select('follower_id',{count:'exact',head:true}).eq('follower_id',S.user.id).eq('followed_id',id)]);
  S.fc=ca.count||0;S.fg=cb.count||0;S.fm=(cc.count||0)>0;
  const{data,error}=await sb.from('posts').select(SEL).eq('author_id',id).order('created_at',{ascending:false}).limit(50);
  S.posts=error?[]:await attach(data);S.more=false;S.err=error?friendly(error):null;
  if(S.view==='user'){$('.wrap').innerHTML=userView();renderFeed()}
}
const SEL='id,content,image_url,created_at,author_id,repost_of,profiles!author_id(first_name,last_name,group_name,avatar_url),comments(count),reactions(user_id,kind)';
const GR=['linear-gradient(160deg,#176B45,#38A169)','linear-gradient(160deg,#0f4c81,#3aa6b9)','linear-gradient(160deg,#7b2d8e,#d6609b)','linear-gradient(160deg,#b45309,#f59e0b)'];
async function openStory(uid){
  const items=(S.actus||[]).filter(a=>a.author_id===uid).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  if(!items.length)return;
  S.sv={items,i:0,likes:{}};
  const{data}=await sb.from('actu_likes').select('actu_id,user_id').in('actu_id',items.map(a=>a.id));
  (data||[]).forEach(l=>(S.sv.likes[l.actu_id]??=[]).push(l.user_id));
  drawStory();
}
function drawStory(){
  clearTimeout(S.st);const v=S.sv,a=v.items[v.i];$('#ov')?.remove();
  const lk=v.likes[a.id]||[],mine=lk.includes(S.user.id),own=a.author_id===S.user.id,o=document.createElement('div');
  o.id='ov';o.setAttribute('role','dialog');o.style.cssText='position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;color:#fff';
  const txt=a.image_url?'position:absolute;bottom:0;left:0;right:0;margin:0;padding:28px 16px 12px;background:linear-gradient(#0000,#000a);font-size:17px':'font-size:26px;font-weight:700;text-align:center;padding:24px';
  o.innerHTML=`<div style="display:flex;gap:4px;padding:10px 10px 6px">${v.items.map((_,k)=>`<div style="flex:1;height:3px;background:#fff5;border-radius:3px;overflow:hidden"><div class="seg" style="height:100%;background:#fff;width:${k<v.i?'100%':'0'};${k===v.i?'animation:fill 5s linear forwards':''}"></div></div>`).join('')}</div><div style="display:flex;align-items:center;gap:10px;padding:4px 12px">${av(a.profiles)}<div style="flex:1"><b>${esc(a.profiles?.first_name)} ${esc(a.profiles?.last_name)}</b><br><small style="color:#ddd">${ago(a.created_at)}</small></div>${own?`<button class="link" style="color:#fff" data-act="delactu" data-id="${a.id}">Supprimer</button>`:''}<button class="link" style="color:#fff;font-size:22px" data-act="closeov" aria-label="Fermer">✕</button></div><div style="flex:1;position:relative;display:grid;place-items:center;overflow:hidden;${a.image_url?'':'background:'+GR[a.id.charCodeAt(0)%4]}">${a.image_url?`<img src="${esc(a.image_url)}" alt="Image de l’actu" style="max-width:100%;max-height:100%;object-fit:contain">`:''}${a.content?`<p style="${txt};white-space:pre-wrap">${esc(a.content)}</p>`:''}<div data-act="sprev" style="position:absolute;left:0;top:0;bottom:0;width:30%"></div><div data-act="snext" style="position:absolute;right:0;top:0;bottom:0;width:70%"></div></div><div style="padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#111">${own?`<small>👍 ${lk.length} j’aime</small>`:`<div style="display:flex;gap:8px"><button class="sb${mine?' on':''}" data-act="slike">👍 J’aime${lk.length?' · '+lk.length:''}</button><button class="sb" data-act="sreply">↩ Répondre</button><button class="sb" data-act="srepost">🔁 Republier</button></div><form data-f="sreply" style="display:none;gap:6px;margin-top:8px"><input name="m" maxlength="500" placeholder="Votre réponse…" aria-label="Votre réponse" style="margin:0"><button class="btn" style="width:auto;margin:0">Envoyer</button></form>`}</div>`;
  app.append(o);S.st=setTimeout(snext,5000);
}
function snext(){const v=S.sv;if(!v)return;if(v.i+1>=v.items.length){clearTimeout(S.st);$('#ov')?.remove();return}v.i++;drawStory()}
const pauseStory=()=>{clearTimeout(S.st);$('#ov')?.classList.add('paused')};
async function loadConvs(){
  const{data,error}=await sb.from('messages').select('id,content,created_at,read,sender_id,recipient_id,s:profiles!sender_id(id,first_name,last_name,avatar_url),r:profiles!recipient_id(id,first_name,last_name,avatar_url)').order('created_at',{ascending:false}).limit(200);
  if(error)toast(friendly(error),1);
  const m=new Map();
  (data||[]).forEach(x=>{const mine=x.sender_id===S.user.id,id=mine?x.recipient_id:x.sender_id;
    if(!m.has(id))m.set(id,{id,p:mine?x.r:x.s,last:x.content,mine,unread:0});
    if(!mine&&!x.read)m.get(id).unread++});
  S.convs=[...m.values()];if(S.view==='msgs')$('.wrap').innerHTML=msgsView();
}
async function loadChat(first){
  if(S.view!=='chat')return;const o=S.ch,me=S.user.id;
  if(!S.cp||S.cp.id!==o){const{data:p}=await sb.from('profiles').select('id,first_name,last_name,avatar_url').eq('id',o).single();S.cp=p;const t=$('#chn');if(t&&p)t.textContent=p.first_name+' '+p.last_name}
  const{data,error}=await sb.from('messages').select('id,content,created_at,sender_id,read').or(`and(sender_id.eq.${me},recipient_id.eq.${o}),and(sender_id.eq.${o},recipient_id.eq.${me})`).order('created_at').limit(200);
  if(error)return toast(friendly(error),1);
  const n=S.chm?.length;S.chm=data;const c=$('#cl');
  if(S.view==='chat'&&c){
    c.innerHTML=data.length?data.map(x=>{const mine=x.sender_id===me;return `<div style="display:flex;justify-content:${mine?'flex-end':'flex-start'}"><div style="max-width:80%;padding:8px 12px;border-radius:16px;margin:3px 0;background:${mine?'var(--g)':'#fff'};color:${mine?'#fff':'var(--tx)'};white-space:pre-wrap;word-break:break-word">${esc(x.content)}<br><small style="opacity:.7;color:inherit">${new Date(x.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</small></div></div>`}).join(''):'<p class="empty">Écrivez le premier message.</p>';
    if(first||data.length!==n)c.scrollTop=c.scrollHeight;
  }
  if(data.some(x=>x.sender_id===o&&!x.read)){await sb.from('messages').update({read:true}).eq('sender_id',o).eq('recipient_id',me).eq('read',false);loadUnread()}
}
const msgsView=()=>`<h3>Messages</h3>${!S.convs?'<p class="empty">Chargement…</p>':S.convs.length?S.convs.map(c=>`<div class="card top" data-act="chat" data-u="${c.id}" style="cursor:pointer">${av(c.p)}<div class="who" style="flex:1;min-width:0"><b>${esc(c.p?.first_name)} ${esc(c.p?.last_name)}</b><small style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.mine?'Vous : ':''}${esc(c.last.slice(0,60))}</small></div>${c.unread?`<b class="dot">${c.unread}</b>`:''}</div>`).join(''):'<p class="empty">Aucune conversation. Cherchez un membre ci-dessous pour lui écrire.</p>'}<h3>Trouver un membre</h3><input id="q" placeholder="Rechercher un membre par nom" aria-label="Rechercher un membre" style="margin-bottom:10px"><div id="ml">${memList('')}</div>`;
const chatView=()=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><button class="link" data-act="nav" data-v="msgs" aria-label="Retour">←</button><b id="chn">${esc(S.cp?S.cp.first_name+' '+S.cp.last_name:'')}</b></div><div id="cl" class="chat"></div><form data-f="send" style="display:flex;gap:6px"><input name="m" maxlength="1000" required autocomplete="off" placeholder="Écrire un message…" aria-label="Message"><button class="btn" style="width:auto;margin:3px 0">Envoyer</button></form>`;
async function attach(list){
  const ids=[...new Set(list.filter(p=>p.repost_of).map(p=>p.repost_of))];if(!ids.length)return list;
  const{data}=await sb.from('posts').select('id,content,image_url,profiles!author_id(first_name,last_name)').in('id',ids);
  const m=Object.fromEntries((data||[]).map(x=>[x.id,x]));list.forEach(p=>{p.original=m[p.repost_of]||null});return list;
}
const OV='position:fixed;inset:0;background:#000c;z-index:20;display:grid;place-items:center;padding:16px';
const body=p=>{const o=p.repost_of?p.original:null;return o?`<small>🔁 a republié</small><div style="background:var(--bg);border-radius:10px;padding:10px;margin:6px 0"><b>${esc(o.profiles?.first_name)} ${esc(o.profiles?.last_name)}</b><p data-act="open" data-id="${p.id}" style="cursor:pointer;margin:4px 0;white-space:pre-wrap">${esc(o.content)}</p>${o.image_url?`<img class="ph" src="${esc(o.image_url)}" alt="Photo de la publication" loading="lazy">`:''}</div>`:!p.content?'<small>🔁 Publication d’origine supprimée</small>':`<p data-act="open" data-id="${p.id}" style="cursor:pointer;white-space:pre-wrap">${esc(p.content)}</p>`};
async function loadActus(){
  const{data,error}=await sb.from('actus').select('id,content,image_url,created_at,author_id,profiles!author_id(first_name,last_name,avatar_url)').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(30);
  S.actus=error?[]:data;renderActus();
}
const renderActus=()=>{const e=$('#actus');if(!e)return;
  const g=new Map();(S.actus||[]).forEach(a=>{if(!g.has(a.author_id))g.set(a.author_id,[]);g.get(a.author_id).push(a)});
  e.innerHTML=`<h3 style="margin:4px 0 6px">Actus</h3><div class="actus"><button class="actu add" data-act="newactu"><span>＋</span>Créer une actu</button>${[...g.entries()].map(([u,l])=>{const a=l[0];return `<button class="actu" data-act="viewactu" data-u="${u}"${a.image_url?` style="background-image:linear-gradient(#0000,#000b),url('${esc(a.image_url)}')"`:''}>${av(a.profiles)}${l.length>1?`<i class="cnt">${l.length}</i>`:''}<b>${u===S.user.id?'Vous':esc(a.profiles?.first_name)}</b>${a.image_url?'':`<em>${esc(a.content.slice(0,50))}</em>`}</button>`}).join('')}</div>`};
function showActu(a){
  const o=document.createElement('div');o.id='ov';o.style.cssText=OV;o.setAttribute('role','dialog');
  o.innerHTML=`<div class="card" style="width:100%;max-width:420px;margin:0;max-height:92vh;overflow:auto"><div class="top">${av(a.profiles)}<div class="who"><b>${esc(a.profiles?.first_name)} ${esc(a.profiles?.last_name)}</b><small>${ago(a.created_at)} · disparaît après 24 h</small></div></div>${a.image_url?`<img class="ph" src="${esc(a.image_url)}" alt="Image de l’actu">`:''}<p style="font-size:18px;white-space:pre-wrap">${esc(a.content)}</p>${a.author_id===S.user.id?`<button class="btn ghost" data-act="delactu" data-id="${a.id}">Supprimer mon actu</button>`:''}<button class="btn" data-act="closeov">Fermer</button></div>`;
  app.append(o);
}
const postView=()=>'<button class="btn ghost" data-act="nav" data-v="feed">← Retour au fil</button><div id="feed" style="margin-top:12px"></div>';
const notifView=()=>`<h3>Notifications</h3>${!S.notifs?'<p class="empty">Chargement…</p>':S.notifs.length?'<button class="btn ghost" data-act="readall">Tout marquer comme lu</button>'+S.notifs.map(n=>`<div class="card notif" data-act="notif" data-id="${n.id}" data-p="${n.post_id}" data-u="${n.actor_id}" style="${n.read?'':'border-left:4px solid var(--g2)'}"><b>${esc(n.profiles?.first_name)} ${esc(n.profiles?.last_name)}</b> ${n.type==='follow'?'a rejoint votre communauté':(n.type==='comment'?'a commenté':n.type==='repost'?'a republié':'a réagi à')+' votre publication'}<br><small>« ${esc((n.posts?.content||'').slice(0,80))} » · ${ago(n.created_at)}</small></div>`).join(''):'<p class="empty">Aucune notification pour le moment.</p>'}`;

async function loadPosts(reset){
  if(reset){S.page=0;S.posts=[]}
  const f=S.page*PS;
  const{data,error}=await sb.from('posts').select(SEL).order('created_at',{ascending:false}).range(f,f+PS-1);
  if(error){S.err=friendly(error);return}
  S.err=null;S.posts=S.posts.concat(await attach(data));S.more=data.length===PS;S.page++;
}
async function shrink(f){
  if(!f.type.startsWith('image/'))throw new Error('Choisissez une image.');
  const b=await createImageBitmap(f),r=Math.min(1,1280/Math.max(b.width,b.height)),c=document.createElement('canvas');
  c.width=Math.round(b.width*r);c.height=Math.round(b.height*r);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
  const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.82));
  if(!blob||blob.size>2097152)throw new Error('Image trop lourde (2 Mo maximum).');return blob;
}
async function upload(bucket,f){
  const blob=await shrink(f),path=`${S.user.id}/${Date.now()}.jpg`;
  const{error}=await sb.storage.from(bucket).upload(path,blob,{contentType:'image/jpeg'});
  if(error)throw error;return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

/* ---------- actions ---------- */
const pid=e=>e.target.closest('article')?.dataset.id;
const H={
  async nav(e){
    const v=e.target.dataset.v;if(v==='me')return H.user({target:{dataset:{u:S.user.id}}});S.view=v;render();
    if(v==='feed'){await loadPosts(true);renderFeed();await loadActus()}
    if(v==='notifs')await loadNotifs();
    if(v==='msgs'){await loadConvs();await loadMembers()}
  },
  async user(e){S.view='user';S.U=null;render();await loadUser(e.target.dataset.u)},
  async readall(){await sb.from('notifications').update({read:true}).eq('user_id',S.user.id).eq('read',false);await loadNotifs();await loadUnread()},
  mode(e){S.mode=e.target.dataset.m;render()},
  async out(){if(confirm('Voulez-vous vraiment vous déconnecter ?'))await sb.auth.signOut()},
  like(e){H.react({target:{dataset:{k:'like'},closest:s=>e.target.closest(s)}})},
  async open(e){
    const p=S.posts.find(x=>x.id===e.target.dataset.id);if(!p)return;
    S.view='post';S.posts=[p];S.more=false;S.err=null;render();scrollTo(0,0);await loadCm(p.id);
  },
  async repost(e){
    const p=S.posts.find(x=>x.id===pid(e));if(!p)return;
    const orig=p.repost_of||p.id;
    if(orig===p.id&&p.author_id===S.user.id)return toast('C’est déjà votre publication.',1);
    if(!confirm('Republier cette publication sur votre profil ?'))return;
    const{error}=await sb.from('posts').insert({author_id:S.user.id,content:'',repost_of:orig});
    if(error)return toast(error.code==='23505'?'Vous avez déjà republié cette publication.':friendly(error),1);
    toast('Publication republiée sur votre profil.');
    if(S.view==='feed'){await loadPosts(true);renderFeed()}
  },
  newactu(){
    const o=document.createElement('div');o.id='ov';o.style.cssText=OV;
    o.innerHTML='<form class="card" data-f="actu" style="width:100%;max-width:420px;margin:0"><h3 style="margin:0">Créer une actu</h3><label>Votre message (200 caractères max.)<textarea name="t" maxlength="200"></textarea></label><label>Photo (facultative)<input type="file" accept="image/*"></label><p class="note">Elle disparaît automatiquement après 24 h. Pas de coordonnées personnelles ni de photos d’autres personnes sans autorisation.</p><button class="btn">Publier l’actu</button><button type="button" class="btn ghost" data-act="closeov">Annuler</button></form>';
    app.append(o);
  },
  viewactu(e){openStory(e.target.dataset.u)},
  closeov(){clearTimeout(S.st);$('#ov')?.remove()},
  async delactu(e){
    if(!confirm('Supprimer cette actu ?'))return;
    clearTimeout(S.st);const{error}=await sb.from('actus').delete().eq('id',e.target.dataset.id);
    if(error)return toast(friendly(error),1);$('#ov')?.remove();await loadActus();
  },
  async join(e){
    const id=e.target.dataset.u,me=S.user.id;
    const{error}=await(S.fm?sb.from('follows').delete().eq('follower_id',me).eq('followed_id',id):sb.from('follows').insert({follower_id:me,followed_id:id}));
    if(error)return toast(friendly(error),1);
    S.fm=!S.fm;S.fc=(S.fc||0)+(S.fm?1:-1);
    if(S.view==='user'){$('.wrap').innerHTML=userView();renderFeed()}
    toast(S.fm?'Vous avez rejoint ce membre.':'Vous ne le suivez plus.');
  },
  async chat(e){S.view='chat';S.ch=e.target.dataset.u;S.cp=null;S.chm=null;render();await loadChat(true)},
  sprev(){const v=S.sv;if(v.i>0)v.i--;drawStory()},
  snext(){snext()},
  async slike(){
    pauseStory();const v=S.sv,a=v.items[v.i],me=S.user.id,lk=v.likes[a.id]??=[],has=lk.includes(me);
    const{error}=await(has?sb.from('actu_likes').delete().eq('actu_id',a.id).eq('user_id',me):sb.from('actu_likes').insert({actu_id:a.id,user_id:me}));
    if(error)return toast(friendly(error),1);
    v.likes[a.id]=has?lk.filter(x=>x!==me):[...lk,me];
    const b=$('[data-act=slike]'),n=v.likes[a.id].length;b.className='sb'+(has?'':' on');b.textContent='👍 J’aime'+(n?' · '+n:'');
  },
  sreply(){pauseStory();const f=$('#ov form');f.style.display='flex';f.elements.m.focus()},
  async srepost(){
    pauseStory();const a=S.sv.items[S.sv.i];
    if(!confirm('Republier cette actu sur votre profil ?'))return;
    const n=(a.profiles?.first_name||'')+' '+(a.profiles?.last_name||'');
    const{error}=await sb.from('posts').insert({author_id:S.user.id,content:((a.content||'🔁 Actu republiée')+'\n\n🔁 Actu de '+n).slice(0,2000),image_url:a.image_url});
    if(error)return toast(friendly(error),1);
    toast('Actu republiée sur votre profil.');
  },
  async notif(e){
    const d=e.target.dataset;
    await sb.from('notifications').update({read:true}).eq('id',d.id);loadUnread();
    if(!d.p||d.p==='null')return H.user({target:{dataset:{u:d.u}}});const{data,error}=await sb.from('posts').select(SEL).eq('id',d.p).single();
    if(error||!data)return toast('Cette publication n’est plus disponible.',1);
    await attach([data]);S.view='post';S.posts=[data];S.more=false;S.err=null;S.open[d.p]=true;render();await loadCm(d.p);
  },
  replyc(e){const i=e.target.closest('article').querySelector('input[name=c]');i.value='@'+e.target.dataset.n+' ';i.focus()},
  async retry(){await loadPosts(true);renderFeed()},
  async more(){await loadPosts();renderFeed()},
  async react(e){
    const id=pid(e),k=e.target.dataset.k,p=S.posts.find(x=>x.id===id),my=p.reactions.find(r=>r.user_id===S.user.id),u=S.user.id;
    const q=my&&my.kind===k?sb.from('reactions').delete().eq('post_id',id).eq('user_id',u):my?sb.from('reactions').update({kind:k}).eq('post_id',id).eq('user_id',u):sb.from('reactions').insert({post_id:id,user_id:u,kind:k});
    const{error}=await q;if(error)return toast(friendly(error),1);
    p.reactions=p.reactions.filter(r=>r.user_id!==u);if(!(my&&my.kind===k))p.reactions.push({user_id:u,kind:k});renderFeed();
  },
  async comments(e){
    const id=pid(e);S.open[id]=!S.open[id];renderFeed();
    if(S.open[id])await loadCm(id);
  },
  async del(e){
    if(!confirm('Supprimer cette publication ?'))return;
    const{error}=await sb.from('posts').delete().eq('id',pid(e));if(error)return toast(friendly(error),1);
    await loadPosts(true);renderFeed();toast('Publication supprimée.');
  },
  async edit(e){
    const id=pid(e),p=S.posts.find(x=>x.id===id),t=prompt('Modifier votre publication',p.content);
    if(!t||!t.trim())return;
    const{error}=await sb.from('posts').update({content:t.trim().slice(0,2000)}).eq('id',id);if(error)return toast(friendly(error),1);
    p.content=t.trim().slice(0,2000);renderFeed();toast('Publication modifiée.');
  },
  async report(e){
    const r=prompt('Pourquoi signalez-vous cette publication ?');if(!r||r.trim().length<3)return;
    const{error}=await sb.from('reports').insert({reporter_id:S.user.id,post_id:pid(e),reason:r.trim().slice(0,500)});
    error?toast(friendly(error),1):toast('Merci, signalement envoyé à la modération.');
  },
  async repc(e){
    const r=prompt('Pourquoi signalez-vous ce commentaire ?');if(!r||r.trim().length<3)return;
    const{error}=await sb.from('reports').insert({reporter_id:S.user.id,comment_id:e.target.closest('.cm').dataset.cid,reason:r.trim().slice(0,500)});
    error?toast(friendly(error),1):toast('Merci, signalement envoyé.');
  },
  async delc(e){
    if(!confirm('Supprimer ce commentaire ?'))return;
    const id=pid(e),{error}=await sb.from('comments').delete().eq('id',e.target.closest('.cm').dataset.cid);
    if(error)return toast(friendly(error),1);
    await loadCm(id);await refreshCount(id);
  }
};
async function loadCm(id){
  const{data,error}=await sb.from('comments').select('id,content,created_at,author_id,profiles!author_id(first_name,last_name)').eq('post_id',id).order('created_at');
  if(error)return toast(friendly(error),1);S.cm[id]=data;renderFeed();
}
async function refreshCount(id){
  const{count}=await sb.from('comments').select('id',{count:'exact',head:true}).eq('post_id',id);
  const p=S.posts.find(x=>x.id===id);if(p)p.comments=[{count}];renderFeed();
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)H[b.dataset.act]?.({target:b})});
app.addEventListener('change',e=>{
  if(e.target.id==='file'){
    const f=e.target.files[0];S.img=f||null;$('#prev').innerHTML='';
    if(f){const i=document.createElement('img');i.alt='Aperçu de la photo';i.src=URL.createObjectURL(f);$('#prev').append(i)}
  }
});
const F={
  async login(f){
    const d=new FormData(f),{error}=await sb.auth.signInWithPassword({email:d.get('email').trim(),password:d.get('p')});
    if(error)toast(friendly(error),1);
  },
  async signup(f){
    const d=new FormData(f);
    if(d.get('p')!==d.get('p2'))return toast('Les mots de passe ne sont pas identiques.',1);
    const meta={};['first_name','last_name','group_name','district','province','country','scout_role'].forEach(k=>meta[k]=String(d.get(k)).trim());
    const{data,error}=await sb.auth.signUp({email:d.get('email').trim(),password:d.get('p'),options:{data:meta}});
    if(error)return toast(friendly(error),1);
    if(!data.session){S.mode='login';render();toast('Compte créé ! Vérifiez votre boîte e-mail pour confirmer, puis connectez-vous.')}
    else toast('Bienvenue sur SCOUTVERSE !');
  },
  async forgot(f){
    const{error}=await sb.auth.resetPasswordForEmail(new FormData(f).get('email').trim(),{redirectTo:location.origin});
    error?toast(friendly(error),1):toast('Si cette adresse existe, un lien vient d’être envoyé.');
  },
  async newpass(f){
    const{error}=await sb.auth.updateUser({password:new FormData(f).get('p')});
    if(error)return toast(friendly(error),1);S.recovery=false;render();toast('Mot de passe modifié.');
  },
  async send(f){
    const m=f.elements.m.value.trim();if(!m)return;
    const{error}=await sb.from('messages').insert({sender_id:S.user.id,recipient_id:S.ch,content:m});
    if(error)return toast(friendly(error),1);
    f.reset();await loadChat(true);
  },
  async sreply(f){
    const a=S.sv.items[S.sv.i],m=f.elements.m.value.trim();if(!m)return;
    const q=a.content?' « '+a.content.slice(0,40)+' »':'';
    const{error}=await sb.from('messages').insert({sender_id:S.user.id,recipient_id:a.author_id,content:('↩ Réponse à votre actu'+q+' : '+m).slice(0,1000)});
    if(error)return toast(friendly(error),1);
    toast('Réponse envoyée dans ses messages.');clearTimeout(S.st);$('#ov')?.remove();
  },
  async actu(f){
    const t=f.elements.t.value.trim(),file=f.querySelector('input[type=file]').files[0],b=f.querySelector('.btn');
    if(!t&&!file)return toast('Écrivez un message ou ajoutez une photo.',1);
    b.disabled=true;
    try{
      const url=file?await upload('post-images',file):null;
      const{error}=await sb.from('actus').insert({author_id:S.user.id,content:t,image_url:url});if(error)throw error;
      $('#ov')?.remove();await loadActus();toast('Actu publiée !');
    }catch(x){toast('Publication impossible : '+x.message,1);b.disabled=false}
  },
  async post(f){
    const t=$('#txt').value.trim(),b=$('#pub');if(!t)return toast('Écrivez un message.',1);
    b.disabled=true;
    try{
      const url=S.img?await upload('post-images',S.img):null;
      const{error}=await sb.from('posts').insert({author_id:S.user.id,content:t,image_url:url});if(error)throw error;
      S.img=null;f.reset();$('#prev').innerHTML='';await loadPosts(true);renderFeed();toast('Publication envoyée !');
    }catch(x){toast('Publication impossible : '+x.message,1)}
    b.disabled=false;
  },
  async comment(f){
    const id=f.closest('article').dataset.id,c=new FormData(f).get('c').trim();if(!c)return;
    const{error}=await sb.from('comments').insert({post_id:id,author_id:S.user.id,content:c});
    if(error)return toast(friendly(error),1);
    await loadCm(id);await refreshCount(id);
  },
  async profile(f){
    const d=new FormData(f),u={};['first_name','last_name','group_name','district','province','country','scout_role','bio'].forEach(k=>u[k]=String(d.get(k)||'').trim());
    if(!u.first_name||!u.last_name)return toast('Prénom et nom obligatoires.',1);
    try{
      const a=$('#avf').files[0];if(a)u.avatar_url=await upload('avatars',a);
      const{error}=await sb.from('profiles').update(u).eq('id',S.user.id);if(error)throw error;
      await loadMe();S.view='user';render();await loadUser(S.user.id);toast('Profil enregistré.');
    }catch(x){toast('Enregistrement impossible : '+x.message,1)}
  }
};
app.addEventListener('submit',e=>{e.preventDefault();F[e.target.dataset.f]?.(e.target)});
app.addEventListener('input',e=>{if(e.target.id==='q')$('#ml').innerHTML=memList(e.target.value)});
render();
</script></body></html>
